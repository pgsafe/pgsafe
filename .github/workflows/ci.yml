name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

env:
  IMAGE: ghcr.io/pgsafe/pgsafe

jobs:
  # ── Docker multi-arch build & push ──────────────────────────────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # main  →  :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # v1.2.3  →  :1.2.3
            type=semver,pattern={{version}}
            # v1.2.3  →  :1-latest
            type=semver,pattern={{major}},suffix=-latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Static binaries ─────────────────────────────────────────────────────────
  binaries:
    name: Binary (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Version (tags only)
        id: ver
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o pgsafe ./cmd/pgsafe

      # main: pgsafe-a1b2c3d-latest-amd64
      - name: Upload artifact (main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pgsafe-${{ steps.sha.outputs.short }}-latest-${{ matrix.arch }}
          path: pgsafe
          if-no-files-found: error

      # tag: pgsafe-1.2.3-amd64
      - name: Upload artifact (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: pgsafe-${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          path: pgsafe
          if-no-files-found: error
