name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:

  # ── Build & push image tagged with git SHA ─────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}

  # ── E2E matrix ─────────────────────────────────────────────────────────────
  test:
    name: "${{ matrix.mode }} / ${{ matrix.format }} / ${{ matrix.compression }} / enc:${{ matrix.encryption }} / filter:${{ matrix.filter }} / jobs:${{ matrix.compression_jobs || '1' }}"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: true
      matrix:
        mode:        [single, multi, both]
        format:      [custom, plain, tar]
        compression: [none, gzip, bzip2, xz]
        encryption:  [false, true]
        filter:      [none]
        include:
          - {mode: multi, format: custom, compression: none, encryption: false, filter: glob}
          - {mode: multi, format: custom, compression: none, encryption: false, filter: regex}
          - {mode: both,  format: custom, compression: none, encryption: false, filter: glob}
          - {mode: both,  format: custom, compression: none, encryption: false, filter: regex}
          # parallel compression (jobs=4) — one case per algorithm
          - {mode: single, format: custom, compression: gzip,  encryption: false, filter: none, compression_jobs: 4}
          - {mode: single, format: custom, compression: bzip2, encryption: false, filter: none, compression_jobs: 4}
          - {mode: single, format: custom, compression: xz,    encryption: false, filter: none, compression_jobs: 4}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: |
          docker pull ${{ env.IMAGE }}:${{ github.sha }}
          # pgsafe is FROM postgres:18 so this only fetches the manifest
          docker pull postgres:18

      # ── Infrastructure ──────────────────────────────────────────────────────

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          until curl -sf http://localhost:9000/minio/health/live; do sleep 2; done

      - name: Create MinIO bucket
        run: |
          docker run --rm --network host \
            --entrypoint /bin/sh minio/mc -c \
            'mc alias set s http://localhost:9000 minioadmin minioadmin --quiet && mc mb s/pgsafe-test'

      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=testdb \
            -v "$GITHUB_WORKSPACE/e2e/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro" \
            postgres:18-alpine
          until docker exec postgres pg_isready -U postgres; do sleep 2; done

      # ── Run pgsafe ──────────────────────────────────────────────────────────

      - name: Run pgsafe
        env:
          CIPHER_KEY: test-e2e-cipher-key-for-aes256!!
        run: |
          ARGS=(
            --rm --network host
            -e S3_ENDPOINT=http://localhost:9000
            -e S3_BUCKET=pgsafe-test
            -e S3_REGION=us-east-1
            -e S3_ACCESS_KEY_ID=minioadmin
            -e S3_SECRET_ACCESS_KEY=minioadmin
            -e S3_PATH_STYLE=true
            -e DUMP_FORMAT=${{ matrix.format }}
            -e COMPRESSION_METHOD=${{ matrix.compression }}
            -e COMPRESSION_JOBS=${{ matrix.compression_jobs || '1' }}
          )
          if [[ "${{ matrix.mode }}" != "multi" ]]; then
            ARGS+=(-e SINGLE_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/testdb)
          fi
          if [[ "${{ matrix.mode }}" != "single" ]]; then
            ARGS+=(-e MULTI_PROD_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres)
          fi
          if [[ "${{ matrix.encryption }}" == "true" ]]; then
            ARGS+=(-e ENCRYPTION_CIPHER_KEY="$CIPHER_KEY")
          fi
          if [[ "${{ matrix.filter }}" == "glob" ]]; then
            ARGS+=(-e MULTI_PROD_DATABASE_NAMES_GLOB=testdb)
          elif [[ "${{ matrix.filter }}" == "regex" ]]; then
            ARGS+=(-e "MULTI_PROD_DATABASE_NAMES_REGEX=^testdb$")
          fi
          docker run "${ARGS[@]}" ${{ env.IMAGE }}:${{ github.sha }}

      # ── Download & verify ───────────────────────────────────────────────────

      - name: Download backups from MinIO
        run: |
          mkdir -p /tmp/backups
          docker run --rm --network host \
            -v /tmp/backups:/out \
            --entrypoint /bin/sh minio/mc -c \
            'mc alias set s http://localhost:9000 minioadmin minioadmin --quiet && mc mirror s/pgsafe-test /out'

      - name: Verify backups
        env:
          CIPHER_KEY: test-e2e-cipher-key-for-aes256!!
        run: |
          case "${{ matrix.mode }}" in
            single) EXPECT_CONNS=TEST; TESTDB_CONN=TEST ;;
            multi)  EXPECT_CONNS=PROD; TESTDB_CONN=PROD ;;
            both)   EXPECT_CONNS=TEST,PROD; TESTDB_CONN=TEST ;;
          esac

          ARGS=(
            --backup-dir   /tmp/backups
            --format       ${{ matrix.format }}
            --compression  ${{ matrix.compression }}
            --encryption   ${{ matrix.encryption }}
            --expect-conns "$EXPECT_CONNS"
            --testdb-conn  "$TESTDB_CONN"
          )
          if [[ "${{ matrix.encryption }}" == "true" ]]; then
            ARGS+=(--cipher-key "$CIPHER_KEY")
          fi
          if [[ "${{ matrix.filter }}" != "none" ]]; then
            ARGS+=(--expect-no-db PROD/postgres)
          fi
          bash e2e/verify.sh "${ARGS[@]}"

  # ── Promote SHA tag to latest (main branch only) ───────────────────────────
  tag:
    name: Tag latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote to latest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ github.sha }}
